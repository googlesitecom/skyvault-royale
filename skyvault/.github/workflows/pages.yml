name: Deploy a GitHub Pages

# Compila la version web (WASM + WebGL2) con Emscripten y la publica en
# GitHub Pages en cada push a main. Alternativa: la carpeta docs/ del repo
# ya contiene una build precompilada (Settings -> Pages -> Branch: main /docs).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar
        uses: actions/checkout@v4

      - name: Instalar Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk
          ./emsdk/emsdk install 6.0.10
          ./emsdk/emsdk activate 6.0.10
          echo "$PWD/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Version de emcc
        run: emcc --version | head -1

      - name: Configurar (emcmake)
        run: >
          emcmake cmake -B build-web
          -DSKYVAULT_WEB=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Compilar (WebAssembly)
        run: cmake --build build-web --target skyvault -j "$(nproc)"

      - name: Preparar sitio
        run: |
          mkdir -p site
          cp build-web/skyvault.html site/index.html
          cp build-web/skyvault.js   site/
          cp build-web/skyvault.wasm site/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
